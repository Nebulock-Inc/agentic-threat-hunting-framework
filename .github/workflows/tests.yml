name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test on ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
        exclude:
          # Optional: Reduce matrix size by excluding some combinations
          - os: macos-latest
            python-version: '3.8'
          - os: windows-latest
            python-version: '3.8'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 athf --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 athf --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Type check with mypy
      run: |
        mypy athf --ignore-missing-imports

    - name: Test with pytest
      run: |
        pytest tests/ -v --cov=athf --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  validate-hunts:
    name: Validate Hunt Examples
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install ATHF
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Validate all hunts
      run: |
        athf hunt validate

    - name: Check hunt statistics
      run: |
        athf hunt stats

  docs:
    name: Build Documentation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[docs]"

    - name: Check markdown links
      run: |
        # Install markdown-link-check
        npm install -g markdown-link-check
        # Check all markdown files for broken links
        find . -name "*.md" -not -path "./node_modules/*" -not -path "./.github/*" | xargs markdown-link-check --config config/.markdown-link-check.json
      continue-on-error: true  # Don't fail on external link issues

    - name: Validate markdown formatting
      run: |
        # Install markdownlint
        npm install -g markdownlint-cli
        # Check markdown style
        markdownlint '**/*.md' --ignore node_modules --ignore .github
      continue-on-error: true  # Don't fail build on style issues

  build:
    name: Build Package
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: |
        python -m build

    - name: Check package with twine
      run: |
        twine check dist/*

    - name: Verify every source subpackage ships in the wheel
      run: |
        python - <<'PY'
        import glob, pathlib, sys, zipfile

        on_disk = {
            str(p.parent).replace("/", ".")
            for p in pathlib.Path("athf").rglob("__init__.py")
        }
        wheel = glob.glob("dist/*.whl")[0]
        shipped = {
            "/".join(n.split("/")[:-1]).replace("/", ".")
            for n in zipfile.ZipFile(wheel).namelist()
            if n.endswith("__init__.py")
        }

        missing = sorted(on_disk - shipped)
        if missing:
            print(f"Subpackages present in source but absent from {wheel}:")
            for m in missing:
                print(f"  - {m}")
            sys.exit(1)
        print(f"All {len(on_disk)} subpackages ship in the wheel.")
        PY

    - name: Import the built wheel in a clean environment
      run: |
        python -m venv /tmp/wheelcheck
        /tmp/wheelcheck/bin/pip install --quiet dist/*.whl
        # Names are collected here, inside the checkout, because the import must
        # run from outside it: a stdin script puts the working directory first on
        # sys.path, so running this from the repo root resolves athf against the
        # source tree and passes even when the wheel ships nothing. The __file__
        # assertion is what keeps the step from going hollow again.
        python - <<'PY' > /tmp/subpackages.txt
        import pathlib

        for path in sorted(pathlib.Path("athf").rglob("__init__.py")):
            print(str(path.parent).replace("/", "."))
        PY
        cd /tmp
        /tmp/wheelcheck/bin/python - <<'PY'
        import importlib, pathlib, sys

        root = pathlib.Path("/tmp/wheelcheck").resolve()
        names = pathlib.Path("/tmp/subpackages.txt").read_text().split()
        for name in names:
            module = importlib.import_module(name)
            location = pathlib.Path(module.__file__).resolve()
            if root not in location.parents:
                sys.exit(f"{name} imported from {location}, not the installed wheel")
        print(f"All {len(names)} subpackages import from the installed wheel.")
        PY

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
        retention-days: 7
