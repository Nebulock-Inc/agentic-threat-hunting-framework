name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test on ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 athf --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 athf --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Type check with mypy
      run: |
        mypy athf --ignore-missing-imports

    - name: Test with pytest
      run: |
        # Only [dev] is installed here on purpose: this job proves ATHF degrades
        # gracefully when mcp / scikit-learn / mitreattack-python are absent.
        # The test-extras job is what actually exercises those code paths.
        pytest tests/ -v --cov=athf --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  test-extras:
    name: Test with optional extras - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies with all extras
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,all]"

    - name: Fail if any test is still skipped for a missing dependency
      run: |
        # The default `test` job installs only [dev], which silently skips the
        # MCP tool layer and every `athf similar` test. Guard against a new
        # importorskip quietly shrinking coverage here too.
        pytest tests/ -q --no-header -rs > extras.log 2>&1 || (cat extras.log; exit 1)
        cat extras.log
        if grep -qiE "SKIPPED.*(not installed|importorskip)" extras.log; then
          echo "::error::A test was skipped for a missing dependency even though all extras are installed."
          exit 1
        fi

  validate-hunts:
    name: Validate Hunt Examples
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install ATHF
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Validate all hunts
      run: |
        athf hunt validate

    - name: Check hunt statistics
      run: |
        athf hunt stats

  docs:
    name: Build Documentation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[docs]"

    - name: Check markdown links
      run: |
        # Install markdown-link-check
        npm install -g markdown-link-check
        # Check all markdown files for broken links
        find . -name "*.md" -not -path "./node_modules/*" -not -path "./.github/*" | xargs markdown-link-check --config config/.markdown-link-check.json
      continue-on-error: true  # Don't fail on external link issues

    - name: Validate markdown formatting
      run: |
        # Install markdownlint
        npm install -g markdownlint-cli
        # Check markdown style
        markdownlint '**/*.md' --ignore node_modules --ignore .github
      continue-on-error: true  # Don't fail build on style issues

  build:
    name: Build Package
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: |
        python -m build

    - name: Check package with twine
      run: |
        twine check dist/*

    - name: Verify the artifact ships and imports every subpackage
      run: |
        python scripts/verify_packaging.py --dist-dir dist --repo-root .

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
        retention-days: 7
